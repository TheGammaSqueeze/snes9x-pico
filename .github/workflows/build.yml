# Builds the core blob on every push and pull request, runs the host test on a generated test
# cartridge and keeps the result as a workflow artifact. A tag named v* also publishes a GitHub
# release with the SD card zip and the source archive.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blob:
    # 22.04's gcc-arm-none-eabi is 10.3-2021.07, the toolchain the blob is developed and tested with
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            binutils-arm-none-eabi g++ zip
          arm-none-eabi-gcc --version | head -1

      - name: Build the blob
        run: ./build.sh

      - name: Host test
        run: |
          tools/build_host_test.sh
          tools/make_test_rom.py out/pico_test.sfc
          out/host_test out/pico_test.sfc 600

      - name: Package
        id: pkg
        run: |
          tools/package.sh | tee pkg.txt
          echo "zip=$(sed -n 1p pkg.txt)" >> "$GITHUB_OUTPUT"
          echo "src=$(sed -n 2p pkg.txt)" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$(sed -n 1p pkg.txt)" .zip)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.src }}
            out/snes9x-pico.blob
            out/snes9x-pico.map

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.src }}
            out/snes9x-pico.blob
